<!doctype html>
<html lang="en">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>X3 Chain — Fly The Ecosystem</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Syne:wght@700;800&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;cursor:crosshair}
canvas{display:block;position:fixed;inset:0}

#ui{position:fixed;inset:0;pointer-events:none;z-index:10;font-family:'IBM Plex Mono',monospace}

/* HUD corners */
#wordmark{position:fixed;top:22px;left:28px;font-family:Syne,sans-serif;font-size:1.4rem;font-weight:800;color:#e0e0f0;letter-spacing:-.01em}
#wordmark span{color:#ffd166}

#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:28px;height:28px;pointer-events:none}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:#00ffb2;opacity:.7}
#crosshair::before{width:2px;height:100%;left:50%;transform:translateX(-50%)}
#crosshair::after{width:100%;height:2px;top:50%;transform:translateY(-50%)}
#crosshair-ring{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;border:1.5px solid rgba(0,255,178,.3);border-radius:50%;transition:border-color .1s,transform .1s}
#crosshair-ring.locked{border-color:#00ffb2;transform:translate(-50%,-50%) scale(1.3)}

/* Speed / stats bar */
#stats{position:fixed;bottom:28px;left:28px;font-size:.7rem;color:#404060;line-height:2;letter-spacing:.12em;text-transform:uppercase}
#stats .val{color:#8b5cf6}

/* Controls hint */
#hint{position:fixed;bottom:28px;right:28px;font-size:.68rem;color:#303050;line-height:2;text-align:right}

/* Protocol tooltip card */
#card{
  position:fixed;
  transform:translate(-50%,-110%);
  background:#06060eee;
  border:1px solid #8b5cf640;
  border-radius:10px;
  padding:14px 20px;
  pointer-events:none;
  opacity:0;
  transition:opacity .15s;
  backdrop-filter:blur(16px);
  min-width:180px;
  z-index:20;
}
#card.vis{opacity:1}
#card-name{font-family:Syne,sans-serif;font-weight:800;font-size:1rem;color:#e0e0f0;margin-bottom:3px}
#card-url{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:#00ffb2;margin-bottom:6px}
#card-desc{font-family:'Space Grotesk',sans-serif;font-size:.8rem;color:#707090;line-height:1.5;max-width:220px}
#card-cta{margin-top:8px;font-size:.7rem;color:#ffd166;letter-spacing:.1em}

/* Kill flash */
#flash{position:fixed;inset:0;background:#00ffb240;opacity:0;pointer-events:none;transition:opacity .08s}

/* Loading */
#load{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .5s}
#load.done{opacity:0;pointer-events:none}
#load-logo{font-family:Syne,sans-serif;font-size:2.6rem;font-weight:800;color:#e0e0f0;margin-bottom:20px;letter-spacing:-.02em}
#load-logo span{color:#ffd166}
#load-bar{width:200px;height:2px;background:#ffffff10;border-radius:2px;overflow:hidden;margin-bottom:12px}
#load-bar-inner{height:100%;background:linear-gradient(90deg,#8b5cf6,#00ffb2);width:0%;transition:width .08s}
#load-msg{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:#404060;letter-spacing:.15em}

/* Score pop */
.pop{position:fixed;font-family:Syne,sans-serif;font-weight:800;font-size:1.3rem;pointer-events:none;z-index:50;animation:popUp .8s ease-out forwards}
@keyframes popUp{0%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-180%) scale(.8)}}
</style>

<div id="load">
  <div id="load-logo">X3<span>★</span>CHAIN</div>
  <div id="load-bar"><div id="load-bar-inner"></div></div>
  <div id="load-msg">CHARGING THRUSTERS...</div>
</div>

<div id="ui">
  <div id="wordmark">X3<span>★</span>STAR</div>
  <div id="crosshair-ring"></div>
  <div id="crosshair"></div>

  <div id="stats">
    SPEED &nbsp;<span class="val" id="sv">0</span> AU/s<br>
    HITS &nbsp;&nbsp;<span class="val" id="hv">0</span><br>
    NODES &nbsp;<span class="val" id="nv">26</span>
  </div>

  <div id="hint">
    MOUSE — aim<br>
    W/S — throttle<br>
    A/D — strafe<br>
    CLICK — fire laser
  </div>
</div>

<div id="card">
  <div id="card-name"></div>
  <div id="card-url"></div>
  <div id="card-desc"></div>
  <div id="card-cta">[ CLICK TO ENTER ]</div>
</div>

<div id="flash"></div>

<script type="importmap">
{"imports":{"three":"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

// ── PROTOCOLS ────────────────────────────────────────────────────────────────
const PROTOCOLS = [
  { name:'X3 Explorer',   url:'https://explorer.x3star.net', desc:'Browse blocks & transactions',  col:0x00ffb2 },
  { name:'Tokenomics',    url:'https://tokenomics.x3star.net',desc:'Supply & emission schedule',   col:0xffd166 },
  { name:'Whitepaper',    url:'https://whitepaper.x3star.net',desc:'Technical architecture',       col:0xe0e0f0 },
  { name:'Roadmap',       url:'https://roadmap.x3star.net',   desc:'Development milestones',       col:0x8b5cf6 },
  { name:'X3 Swap',       url:'https://swap.x3star.net',      desc:'AMM token exchange',           col:0x00ffb2 },
  { name:'Staking',       url:'https://staking.x3star.net',   desc:'Earn protocol rewards',        col:0x8b5cf6 },
  { name:'Bridge',        url:'https://bridge.x3star.net',    desc:'Cross-chain transfers',        col:0xffd166 },
  { name:'Flash Loans',   url:'https://flash.x3star.net',     desc:'Uncollateralized loans',       col:0xff6b9d },
  { name:'Analytics',     url:'https://analytics.x3star.net', desc:'Real-time DeFi metrics',       col:0x00ffb2 },
  { name:'Portfolio',     url:'https://portfolio.x3star.net', desc:'Track your holdings',          col:0x8b5cf6 },
  { name:'NFT Studio',    url:'https://nft.x3star.net',       desc:'Mint & trade NFTs',            col:0xff6b9d },
  { name:'Marketplace',   url:'https://marketplace.x3star.net',desc:'Buy & sell digital assets',  col:0xffd166 },
  { name:'Games',         url:'https://games.x3star.net',     desc:'Play-to-earn gaming',          col:0x00ffb2 },
  { name:'Nodes',         url:'https://nodes.x3star.net',     desc:'Run the network',              col:0x8b5cf6 },
  { name:'Validators',    url:'https://validators.x3star.net',desc:'Block production',             col:0xffd166 },
  { name:'Security',      url:'https://security.x3star.net',  desc:'Audits & bug bounty',          col:0xff6b9d },
  { name:'PHANTOM',       url:'https://www.x3star.net/phantom.html', desc:'Security research preview', col:0x6ef0d0 },
  { name:'Status',        url:'https://status.x3star.net',    desc:'Network health monitor',       col:0x00ffb2 },
  { name:'AI Agents',     url:'https://agents.x3star.net',    desc:'Autonomous on-chain agents',   col:0xff6b9d },
  { name:'Governance',    url:'https://governance.x3star.net',desc:'Vote on proposals',            col:0x8b5cf6 },
  { name:'Treasury',      url:'https://treasury.x3star.net',  desc:'DAO fund allocation',          col:0xffd166 },
  { name:'Grants',        url:'https://grants.x3star.net',    desc:'Builder funding',              col:0x00ffb2 },
  { name:'Launchpad',     url:'https://launch.x3star.net',    desc:'Fair-launch IDOs',             col:0xff6b9d },
  { name:'Community',     url:'https://community.x3star.net', desc:'Join 50K+ builders',           col:0x8b5cf6 },
  { name:'Academy',       url:'https://academy.x3star.net',   desc:'Learn X3 Chain',               col:0x00ffb2 },
  { name:'Developers',    url:'https://dev.x3star.net',       desc:'SDKs & documentation',         col:0xffd166 },
  { name:'Press',         url:'https://press.x3star.net',     desc:'Media kit & news',             col:0xe0e0f0 },
];

// ── RENDERER ─────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000008);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000008, 0.012);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 400);
camera.position.set(0, 2, 20);

// ── STARFIELD ────────────────────────────────────────────────────────────────
const SN = 8000;
const sg = new THREE.BufferGeometry();
const sp = new Float32Array(SN*3), sc = new Float32Array(SN*3);
for(let i=0;i<SN;i++){
  const r = 30+Math.random()*200, t=Math.random()*Math.PI*2, p=Math.acos(2*Math.random()-1);
  sp[i*3]=r*Math.sin(p)*Math.cos(t); sp[i*3+1]=r*Math.sin(p)*Math.sin(t); sp[i*3+2]=r*Math.cos(p);
  const c=Math.random();
  if(c<.33){sc[i*3]=.54;sc[i*3+1]=.36;sc[i*3+2]=.96;}
  else if(c<.66){sc[i*3]=0;sc[i*3+1]=1;sc[i*3+2]=.7;}
  else{sc[i*3]=1;sc[i*3+1]=.82;sc[i*3+2]=.4;}
}
sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
sg.setAttribute('color',new THREE.BufferAttribute(sc,3));
scene.add(new THREE.Points(sg,new THREE.PointsMaterial({size:.4,vertexColors:true,transparent:true,opacity:.85,sizeAttenuation:true})));

// ── NEBULA ───────────────────────────────────────────────────────────────────
[[0x8b5cf6,-15,5,-30,22],[0x00ffb2,20,-4,-50,16],[0xffd166,-5,-8,-20,18],[0xff6b9d,10,8,-40,14]]
  .forEach(([c,x,y,z,s])=>{
    const m=new THREE.Mesh(new THREE.SphereGeometry(1,8,8),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.04}));
    m.scale.set(s*1.5,s*.7,s);m.position.set(x,y,z);scene.add(m);
  });

// ── SPACESHIP ────────────────────────────────────────────────────────────────
const shipGroup = new THREE.Group();

// Main body
const bodyGeo = new THREE.ConeGeometry(0.18, 0.9, 6);
const bodyMat = new THREE.MeshBasicMaterial({color:0x8b5cf6,wireframe:false});
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.rotation.x = -Math.PI/2;
shipGroup.add(body);

// Wings
const wingGeo = new THREE.BufferGeometry();
const wingVerts = new Float32Array([
  0,0,0,  -0.6,-0.1,0.3,  0,0,-0.4,
  0,0,0,   0.6,-0.1,0.3,  0,0,-0.4,
]);
wingGeo.setAttribute('position',new THREE.BufferAttribute(wingVerts,3));
const wingMat = new THREE.MeshBasicMaterial({color:0x6040c0,side:THREE.DoubleSide});
const wings = new THREE.Mesh(wingGeo,wingMat);
shipGroup.add(wings);

// Engine glow
const engGeo = new THREE.SphereGeometry(0.08,8,8);
const engMat = new THREE.MeshBasicMaterial({color:0x00ffb2});
const eng = new THREE.Mesh(engGeo,engMat);
eng.position.set(0,0,0.45);
shipGroup.add(eng);

// Engine trail particles
const TRAIL = 60;
const trailGeo = new THREE.BufferGeometry();
const trailPos = new Float32Array(TRAIL*3);
const trailAges = new Float32Array(TRAIL).fill(1);
trailGeo.setAttribute('position',new THREE.BufferAttribute(trailPos,3));
const trailMat = new THREE.PointsMaterial({size:0.12,color:0x8b5cf6,transparent:true,opacity:.7,sizeAttenuation:true});
const trailMesh = new THREE.Points(trailGeo,trailMat);
scene.add(trailMesh);

shipGroup.position.set(0,0,0);
scene.add(shipGroup);

// ── PROTOCOL NODES ───────────────────────────────────────────────────────────
const nodes = [];
PROTOCOLS.forEach((p,i)=>{
  const phi   = Math.acos(1 - 2*(i+.5)/PROTOCOLS.length);
  const theta = Math.PI*(1+Math.sqrt(5))*i;
  const r = 28 + (i%4)*6;
  const pos = new THREE.Vector3(
    r*Math.sin(phi)*Math.cos(theta),
    r*Math.sin(phi)*Math.sin(theta)*0.4,
    r*Math.cos(phi)
  );

  // Core sphere
  const geo = new THREE.SphereGeometry(0.5,12,12);
  const mat = new THREE.MeshBasicMaterial({color:p.col});
  const mesh = new THREE.Mesh(geo,mat);
  mesh.position.copy(pos);

  // Halo
  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(0.85,12,12),
    new THREE.MeshBasicMaterial({color:p.col,transparent:true,opacity:.07})
  );
  mesh.add(halo);

  // Wireframe ring
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.72,0.03,8,32),
    new THREE.MeshBasicMaterial({color:p.col,transparent:true,opacity:.4})
  );
  ring.rotation.x = Math.PI/2;
  mesh.add(ring);

  mesh.userData = { proto:p, basePos:pos.clone(), t:Math.random()*Math.PI*2, hit:false, dead:false };
  scene.add(mesh);
  nodes.push(mesh);
});

// ── LASERS ───────────────────────────────────────────────────────────────────
const lasers = [];
function fireLaser(){
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  const geo = new THREE.CylinderGeometry(0.015,0.015,2.5,4);
  geo.rotateX(Math.PI/2);
  const mat = new THREE.MeshBasicMaterial({color:0x00ffb2});
  const mesh = new THREE.Mesh(geo,mat);
  mesh.position.copy(shipGroup.position).addScaledVector(dir,1.5);
  mesh.quaternion.copy(camera.quaternion);
  scene.add(mesh);

  // Glow
  const glow = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05,0.05,2.5,4),
    new THREE.MeshBasicMaterial({color:0x00ffb2,transparent:true,opacity:.18})
  );
  glow.rotation.x=Math.PI/2;
  mesh.add(glow);

  lasers.push({mesh, dir:dir.clone(), life:1.0, speed:0.9});
  // Sound via WebAudio
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type='sawtooth';o.frequency.setValueAtTime(1200,ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(200,ctx.currentTime+.15);
    g.gain.setValueAtTime(.12,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.15);
    o.start();o.stop(ctx.currentTime+.15);
  }catch(e){}
}

// ── EXPLOSIONS ───────────────────────────────────────────────────────────────
const explosions = [];
function explode(pos, color){
  const count=24;
  const geo=new THREE.BufferGeometry();
  const positions=new Float32Array(count*3);
  const velocities=[];
  for(let i=0;i<count;i++){
    positions[i*3]=pos.x;positions[i*3+1]=pos.y;positions[i*3+2]=pos.z;
    velocities.push(new THREE.Vector3(
      (Math.random()-.5)*4,(Math.random()-.5)*4,(Math.random()-.5)*4
    ));
  }
  geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
  const mat=new THREE.PointsMaterial({color,size:.2,transparent:true,opacity:1});
  const pts=new THREE.Points(geo,mat);
  scene.add(pts);
  explosions.push({pts,velocities,life:1.0});
}

// ── FLIGHT STATE ─────────────────────────────────────────────────────────────
const keys={w:false,s:false,a:false,d:false};
let speed=0, hits=0;
const shipVel=new THREE.Vector3();
const targetQ=new THREE.Quaternion();
const mouseXY={x:0,y:0};

// Mouse for aiming
window.addEventListener('mousemove',e=>{
  mouseXY.x=(e.clientX/innerWidth)*2-1;
  mouseXY.y=-(e.clientY/innerHeight)*2+1;
});
window.addEventListener('keydown',e=>{if(keys.hasOwnProperty(e.key.toLowerCase()))keys[e.key.toLowerCase()]=true});
window.addEventListener('keyup',e=>{if(keys.hasOwnProperty(e.key.toLowerCase()))keys[e.key.toLowerCase()]=false});
window.addEventListener('click',()=>{
  if(lockedNode){
    window.location.href=lockedNode.userData.proto.url;
  } else {
    fireLaser();
  }
});
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// ── RAYCASTER / LOCK-ON ───────────────────────────────────────────────────────
const raycaster=new THREE.Raycaster();
raycaster.params.Points={threshold:.5};
let lockedNode=null;
const cardEl=document.getElementById('card');
const ring=document.getElementById('crosshair-ring');

// ── TRAIL STATE ───────────────────────────────────────────────────────────────
let trailIdx=0;
const trailWorldPos=[];
for(let i=0;i<TRAIL;i++) trailWorldPos.push(new THREE.Vector3());

// ── CLOCK ─────────────────────────────────────────────────────────────────────
const clock=new THREE.Clock();
let t=0;

// ── ANIMATE ──────────────────────────────────────────────────────────────────
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  t+=dt;

  // Camera yaw/pitch from mouse
  const yaw   = -mouseXY.x * 0.9;
  const pitch =  mouseXY.y * 0.6;
  const camQ = new THREE.Quaternion();
  const yawQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), yaw);
  const pitchQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), pitch);
  camQ.multiplyQuaternions(yawQ, pitchQ);
  camera.quaternion.slerp(camQ, 0.08);

  // Ship trails camera
  const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  const right=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);

  if(keys.w) speed=Math.min(speed+6*dt,8);
  else if(keys.s) speed=Math.max(speed-8*dt,0);
  else speed=Math.max(speed-3*dt,0);

  shipVel.copy(fwd).multiplyScalar(speed*dt);
  if(keys.a) shipVel.addScaledVector(right,-4*dt);
  if(keys.d) shipVel.addScaledVector(right, 4*dt);

  shipGroup.position.add(shipVel);
  shipGroup.quaternion.slerp(camera.quaternion, 0.12);

  // Camera offset behind ship
  const camOffset=fwd.clone().multiplyScalar(-3).add(new THREE.Vector3(0,.7,0));
  camera.position.lerp(shipGroup.position.clone().add(camOffset), 0.1);

  // Engine glow pulse
  const ep=.5+.5*Math.sin(t*12);
  eng.material.color.setHex(speed>0.5 ? 0x00ffb2 : 0x2a0a6a);
  eng.scale.setScalar(.8+ep*.4);

  // Trail
  trailWorldPos[trailIdx].copy(shipGroup.position);
  trailIdx=(trailIdx+1)%TRAIL;
  for(let i=0;i<TRAIL;i++){
    const idx=(trailIdx+i)%TRAIL;
    const pos=trailWorldPos[idx];
    trailPos[i*3]=pos.x; trailPos[i*3+1]=pos.y; trailPos[i*3+2]=pos.z;
    trailAges[i]=i/TRAIL;
  }
  trailGeo.attributes.position.needsUpdate=true;
  trailMat.opacity=speed>0.3 ? .5 : .0;

  // Float nodes
  nodes.forEach(n=>{
    if(n.userData.dead) return;
    const nd=n.userData;
    nd.t+=dt*.3;
    n.position.copy(nd.basePos).add(new THREE.Vector3(
      Math.sin(nd.t)*0.4, Math.cos(nd.t*1.3)*0.3, Math.sin(nd.t*.7)*0.3
    ));
    n.rotation.y+=dt*.4;
    n.children[0].material.opacity=.07+.04*Math.sin(t*2+nd.t);
  });

  // Lasers
  for(let i=lasers.length-1;i>=0;i--){
    const l=lasers[i];
    l.mesh.position.addScaledVector(l.dir,l.speed);
    l.life-=dt*2;
    if(l.life<=0){scene.remove(l.mesh);lasers.splice(i,1);continue;}
    // Check hits
    const lp=l.mesh.position;
    for(const n of nodes){
      if(n.userData.dead) continue;
      if(lp.distanceTo(n.position)<1.2){
        // Hit!
        const proto=n.userData.proto;
        explode(n.position.clone(), proto.col);
        n.userData.dead=true;
        scene.remove(n);
        nodes.splice(nodes.indexOf(n),1);
        scene.remove(l.mesh);
        lasers.splice(i,1);
        hits++;
        document.getElementById('hv').textContent=hits;
        document.getElementById('nv').textContent=nodes.length;
        // Flash
        const f=document.getElementById('flash');
        f.style.opacity='.7';f.style.background=`#${proto.col.toString(16).padStart(6,'0')}60`;
        setTimeout(()=>f.style.opacity='0',100);
        // Score pop
        const pop=document.createElement('div');
        pop.className='pop';pop.textContent='+'+proto.name;
        pop.style.left=`${(mouseXY.x+1)/2*100}vw`;
        pop.style.top=`${(-mouseXY.y+1)/2*100}vh`;
        pop.style.color=`#${proto.col.toString(16).padStart(6,'0')}`;
        document.body.appendChild(pop);
        setTimeout(()=>pop.remove(),900);
        // Navigate after 500ms
        setTimeout(()=>{window.location.href=proto.url;},500);
        break;
      }
    }
  }

  // Explosions
  for(let i=explosions.length-1;i>=0;i--){
    const e=explosions[i];
    e.life-=dt*1.8;
    const pa=e.pts.geometry.attributes.position.array;
    for(let j=0;j<e.velocities.length;j++){
      pa[j*3]+=e.velocities[j].x*dt;
      pa[j*3+1]+=e.velocities[j].y*dt;
      pa[j*3+2]+=e.velocities[j].z*dt;
      e.velocities[j].multiplyScalar(0.95);
    }
    e.pts.geometry.attributes.position.needsUpdate=true;
    e.pts.material.opacity=Math.max(0,e.life);
    if(e.life<=0){scene.remove(e.pts);explosions.splice(i,1);}
  }

  // Lock-on
  raycaster.setFromCamera({x:0,y:0},camera);
  const hits2=raycaster.intersectObjects(nodes,true);
  if(hits2.length){
    let obj=hits2[0].object;
    while(obj.parent&&!obj.userData.proto) obj=obj.parent;
    if(obj.userData.proto){
      lockedNode=obj;
      ring.classList.add('locked');
      const proto=obj.userData.proto;
      document.getElementById('card-name').textContent=proto.name;
      document.getElementById('card-url').textContent=proto.url.replace('https://','');
      document.getElementById('card-desc').textContent=proto.desc;
      // Project to screen
      const p=obj.position.clone().project(camera);
      cardEl.style.left=(p.x+1)/2*innerWidth+'px';
      cardEl.style.top=(1-p.y)/2*innerHeight+'px';
      cardEl.classList.add('vis');
    }
  } else {
    lockedNode=null;
    ring.classList.remove('locked');
    cardEl.classList.remove('vis');
  }

  // HUD speed
  document.getElementById('sv').textContent=speed.toFixed(1);

  renderer.render(scene,camera);
}

// ── FAKE LOAD ─────────────────────────────────────────────────────────────────
let pct=0;
const bar=document.getElementById('load-bar-inner');
const msg=document.getElementById('load-msg');
const msgs=['CHARGING THRUSTERS...','LOADING STAR MAP...','POWERING LASERS...','ALIGNING NODES...','LAUNCH'];
let mi=0;
const li=setInterval(()=>{
  pct+=5+Math.random()*10;
  bar.style.width=Math.min(pct,100)+'%';
  if(pct>25&&mi===0){msg.textContent=msgs[1];mi=1;}
  if(pct>50&&mi===1){msg.textContent=msgs[2];mi=2;}
  if(pct>72&&mi===2){msg.textContent=msgs[3];mi=3;}
  if(pct>=100){
    clearInterval(li);msg.textContent=msgs[4];
    setTimeout(()=>document.getElementById('load').classList.add('done'),300);
    animate();
  }
},60);
</script>
